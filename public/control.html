<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICKII AI — Control</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Courier New',monospace; background:#0a0a0a; color:#00ff41; min-height:100vh; padding:20px; }

        .header { border:1px solid #00ff41; padding:16px 20px; margin-bottom:20px; background:rgba(0,255,65,0.03); display:flex; justify-content:space-between; align-items:center; }
        .title { font-size:26px; font-weight:bold; text-shadow:0 0 10px #00ff41; letter-spacing:2px; }
        .subtitle { font-size:12px; color:#00aa2e; margin-top:4px; }
        .hright { text-align:right; }
        .conn-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:6px; }
        .conn-dot.live { background:#00ff41; box-shadow:0 0 8px #00ff41; animation:blink 2s infinite; }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
        .grid-prompts { display:grid; grid-template-columns:1fr 2fr; gap:16px; margin-bottom:16px; }

        .panel { border:1px solid #00ff41; background:rgba(0,255,65,0.03); padding:16px; }
        .panel-title { font-size:11px; color:#00aa2e; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; border-bottom:1px solid rgba(0,255,65,0.2); padding-bottom:8px; }

        /* Stats */
        .stat { text-align:center; }
        .stat-val { font-size:36px; font-weight:bold; text-shadow:0 0 12px #00ff41; }
        .stat-label { font-size:11px; color:#00aa2e; letter-spacing:1px; margin-top:4px; }

        /* Video preview — circular */
        .video-panel { border:1px solid #00ff41; background:rgba(0,255,65,0.03); padding:16px; }
        .video-wrap {
            position:relative;
            width:100%; aspect-ratio:1/1;
            background:#000; border:1px solid rgba(0,255,65,0.3);
            overflow:hidden;
            border-radius:50%;
            box-shadow: 0 0 20px rgba(0,255,65,0.2);
        }
        #localVideo { 
            width:100%; height:100%; 
            object-fit:cover; 
            display:none; 
            border-radius:50%;
            position:relative;
        }
        #localVideo.on { 
            display:block;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { box-shadow: 0 0 20px rgba(0,255,65,0.2); }
            25% { box-shadow: 0 0 30px rgba(0,255,65,0.4), inset 0 0 30px rgba(255,255,255,0.1); }
            75% { box-shadow: 0 0 25px rgba(0,255,65,0.3); }
        }
        .vid-placeholder {
            position:absolute; inset:0;
            display:flex; align-items:center; justify-content:center;
            font-size:12px; color:#00aa2e; letter-spacing:1px;
            border-radius:50%;
        }
        .vid-placeholder.off { display:none; }

        /* Controls */
        .controls { display:flex; flex-direction:column; gap:10px; }
        label { font-size:11px; color:#00aa2e; letter-spacing:1px; display:block; margin-bottom:4px; }
        select {
            width:100%; background:#0a0a0a; color:#00ff41; border:1px solid #00ff41;
            padding:8px 10px; font-family:'Courier New',monospace; font-size:12px;
        }
        .btn {
            width:100%; padding:10px; font-family:'Courier New',monospace; font-size:12px;
            letter-spacing:1px; cursor:pointer; border:1px solid #00ff41;
            background:rgba(0,255,65,0.05); color:#00ff41; transition:all 0.2s;
        }
        .btn:hover { background:rgba(0,255,65,0.15); box-shadow:0 0 10px rgba(0,255,65,0.3); }
        .btn.stop { border-color:#ff4444; color:#ff4444; background:rgba(255,68,68,0.05); }
        .btn.stop:hover { background:rgba(255,68,68,0.15); }

        /* Log */
        .log {
            height:200px; overflow-y:auto; font-size:11px; line-height:1.8;
            color:#00aa2e; border:1px solid rgba(0,255,65,0.2); padding:10px;
            background:rgba(0,0,0,0.3);
        }
        .log .err { color:#ff4444; }
        .log .ok  { color:#00ff41; }
        .log::-webkit-scrollbar { width:4px; }
        .log::-webkit-scrollbar-thumb { background:#00ff41; }

        /* Prompts */
        .prompts { height:180px; overflow-y:auto; font-size:12px; line-height:1.9; color:#00ff41; }
        .prompt-item { border-bottom:1px solid rgba(0,255,65,0.1); padding:6px 0; }
        .prompt-time { color:#00aa2e; font-size:10px; margin-right:8px; }
        .prompts::-webkit-scrollbar { width:4px; }
        .prompts::-webkit-scrollbar-thumb { background:#00ff41; }
        .empty { color:#00aa2e; font-size:11px; font-style:italic; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <div class="title">NICKII AI</div>
        <div class="subtitle">BACKEND CONTROL PANEL</div>
    </div>
    <div class="hright">
        <div style="font-size:12px"><span class="conn-dot" id="cdot"></span><span id="cstat">OFFLINE</span></div>
        <div style="font-size:11px;color:#00aa2e;margin-top:4px" id="uptime">UPTIME: 00:00</div>
    </div>
</div>

<div class="grid-3">
    <div class="panel stat"><div class="panel-title">Viewers Online</div><div class="stat-val" id="viewerCount">0</div><div class="stat-label">CONNECTED</div></div>
    <div class="panel stat"><div class="panel-title">Prompts</div><div class="stat-val" id="promptCount">0</div><div class="stat-label">RECEIVED</div></div>
    <div class="panel stat"><div class="panel-title">Status</div><div class="stat-val" id="streamStat" style="font-size:18px;padding-top:8px">IDLE</div><div class="stat-label">STREAM</div></div>
</div>

<div class="grid">
    <!-- Video preview -->
    <div class="video-panel">
        <div class="panel-title">Video Preview</div>
        <div class="video-wrap">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="vid-placeholder" id="vidph">[ NO SIGNAL ]</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="panel">
        <div class="panel-title">Stream Controls</div>
        <div class="controls">
            <div>
                <label>Video Source</label>
                <select id="videoSrc"></select>
            </div>
            <div>
                <label>Audio Source (Microphone)</label>
                <select id="audioSrc"></select>
            </div>
            <button class="btn" id="startBtn" onclick="startStream()">► START CAMERA + MIC</button>
            <button class="btn stop" id="stopBtn" onclick="stopStream()" style="display:none">■ STOP STREAM</button>
        </div>
    </div>
</div>

<div class="grid-prompts">
    <!-- System log -->
    <div class="panel">
        <div class="panel-title">System Log</div>
        <div class="log" id="log"></div>
    </div>
    
    <!-- Prompts (right side with more space) -->
    <div class="panel">
        <div class="panel-title">Incoming Prompts</div>
        <div class="prompts" id="prompts"><div class="empty">Waiting for prompts...</div></div>
    </div>
</div>

<script>
// ── State ──
let ws, pc, localStream;
let viewers = 0, prompts = 0, startTime = null;
let streaming = false;

// ── Log ──
function log(msg, type='') {
    const el = document.getElementById('log');
    const t = new Date().toLocaleTimeString();
    el.innerHTML += `<div class="${type}">[${t}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
}

// ── Uptime ──
setInterval(() => {
    if (startTime) {
        const s = Math.floor((Date.now()-startTime)/1000);
        const m = Math.floor(s/60).toString().padStart(2,'0');
        const ss = (s%60).toString().padStart(2,'0');
        document.getElementById('uptime').textContent = `UPTIME: ${m}:${ss}`;
    }
}, 1000);

// ── Populate device lists ──
async function loadDevices() {
    try {
        await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vs = document.getElementById('videoSrc');
        const as = document.getElementById('audioSrc');
        vs.innerHTML = ''; as.innerHTML = '';
        devices.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.deviceId;
            opt.text = d.label || d.deviceId.slice(0,20);
            if (d.kind === 'videoinput') vs.appendChild(opt);
            if (d.kind === 'audioinput') as.appendChild(opt);
        });
        // Pre-select OBS and BlackHole if available
        [...vs.options].forEach(o => { if (o.text.toLowerCase().includes('obs')) vs.value = o.value; });
        [...as.options].forEach(o => { if (o.text.toLowerCase().includes('blackhole') || o.text.toLowerCase().includes('aggregate')) as.value = o.value; });
        log('Devices loaded', 'ok');
    } catch(e) { log('Device error: '+e.message, 'err'); }
}
loadDevices();

// ── WebSocket ──
function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ type:'register-controller' }));
        document.getElementById('cdot').classList.add('live');
        document.getElementById('cstat').textContent = 'ONLINE';
        startTime = Date.now();
        log('Server connected', 'ok');
    };

    ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'viewer-count')      { viewers = d.count; document.getElementById('viewerCount').textContent = d.count; }
        if (d.type === 'request-offer')     { if (streaming) createAndSendOffer(); }
        if (d.type === 'webrtc-answer')     handleAnswer(d.answer);
        if (d.type === 'webrtc-ice-candidate') addIce(d.candidate);
        if (d.type === 'prompt')            addPrompt(d.text, d.timestamp);
        if (d.type === 'return-feed-offer') handleReturnOffer(d.offer);
        if (d.type === 'return-feed-ice')   addReturnIce(d.candidate);
    };

    ws.onclose = () => {
        document.getElementById('cdot').classList.remove('live');
        document.getElementById('cstat').textContent = 'OFFLINE';
        log('Server disconnected — reconnecting...', 'err');
        setTimeout(connectWS, 3000);
    };
}
connectWS();

// ── Start stream ──
async function startStream() {
    try {
        const vid = document.getElementById('videoSrc').value;
        const aud = document.getElementById('audioSrc').value;
        localStream = await navigator.mediaDevices.getUserMedia({
            video: vid ? { deviceId:{ exact:vid } } : true,
            audio: aud ? { deviceId:{ exact:aud } } : true
        });

        // Show preview
        const lv = document.getElementById('localVideo');
        lv.srcObject = localStream;
        lv.classList.add('on');
        document.getElementById('vidph').classList.add('off');

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display  = 'block';
        document.getElementById('streamStat').textContent = 'LIVE';
        streaming = true;
        log('Stream started', 'ok');
        await createAndSendOffer();
    } catch(e) {
        log('Start error: '+e.message, 'err');
    }
}

// ── Create WebRTC offer ──
async function createAndSendOffer() {
    const cfg = { iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}] };
    pc = new RTCPeerConnection(cfg);

    localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

    pc.onicecandidate = (e) => {
        if (e.candidate) ws.send(JSON.stringify({ type:'webrtc-ice-candidate', candidate:e.candidate, target:'viewer' }));
    };

    pc.onconnectionstatechange = () => {
        log('Connection: '+pc.connectionState, pc.connectionState==='connected'?'ok':'');
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({ type:'webrtc-offer', offer }));
    log('Offer sent to viewers', 'ok');
}

async function handleAnswer(answer) {
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer)).catch(e=>log('Answer err:'+e.message,'err'));
}

async function addIce(c) {
    if (c && pc) await pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
}

// ── Stop stream ──
function stopStream() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (pc) { pc.close(); pc = null; }
    const lv = document.getElementById('localVideo');
    lv.srcObject = null; lv.classList.remove('on');
    document.getElementById('vidph').classList.remove('off');
    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display  = 'none';
    document.getElementById('streamStat').textContent = 'IDLE';
    streaming = false;
    log('Stream stopped', 'err');
}

// ── Return feed (viewer webcam) ──
let returnPc;
async function handleReturnOffer(offer) {
    const cfg = { iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}] };
    returnPc = new RTCPeerConnection(cfg);
    returnPc.onicecandidate = (e) => {
        if (e.candidate) ws.send(JSON.stringify({ type:'return-feed-ice', candidate:e.candidate, target:'viewer' }));
    };
    await returnPc.setRemoteDescription(new RTCSessionDescription(offer));
    const ans = await returnPc.createAnswer();
    await returnPc.setLocalDescription(ans);
    ws.send(JSON.stringify({ type:'return-feed-answer', answer:ans, target:'viewer' }));
}
async function addReturnIce(c) {
    if (c && returnPc) await returnPc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
}

// ── Prompts ──
function addPrompt(text, ts) {
    prompts++;
    document.getElementById('promptCount').textContent = prompts;
    const el = document.getElementById('prompts');
    const time = new Date(ts).toLocaleTimeString();
    el.innerHTML = `<div class="prompt-item"><span class="prompt-time">[${time}]</span>${text}</div>` + el.innerHTML.replace('<div class="empty">Waiting for prompts...</div>','');
    log('Prompt: '+text);
}
</script>
</body>
</html>
